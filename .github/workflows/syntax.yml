name: Проверки репозитория

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить синтаксис Python
        run: |
          python -m py_compile \
            solution.py \
            build_train_assets.py \
            build_benchmark_assets.py \
            microcat_classifier.py \
            check_submission.py \
            experiments/*.py
      - name: Проверить пробелы и формат diff
        run: git diff --check origin/main...HEAD
      - name: Проверить неизменность отправленного answer.csv
        run: |
          echo "093072acc21b856f79a982cf67b1d7ffa9f57252387c1b99b4cdea7c66f05cd6  answer.csv" | sha256sum -c -
