name: Compact Python formatting

on:
  push:
    branches:
      - style/compact-python

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/compact-python
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: pip install black==25.1.0
      - name: Format Python files
        run: |
          black --line-length 110 --skip-magic-trailing-comma solution.py build_train_assets.py build_benchmark_assets.py microcat_classifier.py check_submission.py experiments/*.py
          python - <<'PY'
          from pathlib import Path
          import tokenize
          from io import StringIO

          paths = [
              Path("solution.py"),
              Path("build_train_assets.py"),
              Path("build_benchmark_assets.py"),
              Path("microcat_classifier.py"),
              Path("check_submission.py"),
              *sorted(Path("experiments").glob("*.py")),
          ]

          for path in paths:
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()

              string_lines = set()
              try:
                  for token in tokenize.generate_tokens(StringIO(text).readline):
                      if token.type == tokenize.STRING and token.start[0] != token.end[0]:
                          string_lines.update(range(token.start[0], token.end[0] + 1))
              except tokenize.TokenError:
                  pass

              out = []
              previous_source_line = ""

              for i, line in enumerate(lines, start=1):
                  stripped = line.strip()

                  if not stripped and i not in string_lines:
                      continue

                  if stripped and not line.startswith((" ", "\t")):
                      is_top_def = stripped.startswith(("def ", "class ", "async def "))
                      leaving_imports = (
                          out
                          and previous_source_line.startswith(("import ", "from "))
                          and not stripped.startswith(("import ", "from "))
                      )
                      if (is_top_def or leaving_imports) and out and out[-1] != "":
                          out.append("")

                  out.append(line.rstrip())
                  if stripped:
                      previous_source_line = stripped

              path.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8")
          PY
      - name: Compile after formatting
        run: python -m py_compile solution.py build_train_assets.py build_benchmark_assets.py microcat_classifier.py check_submission.py experiments/*.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "Davidkaaa33"
          git config user.email "d.danielian@innopolis.university"
          git add solution.py build_train_assets.py build_benchmark_assets.py microcat_classifier.py check_submission.py experiments/*.py
          git commit -m "Compact Python formatting"
          git push origin HEAD:style/compact-python
